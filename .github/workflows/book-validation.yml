name: validate-book-metadata

on:
  workflow_dispatch:
  push:
    paths:
      - 'post_book.py'
      - 'requirements-book.txt'
      - 'tests/test_post_book.py'
      - 'data/**/*.md'
      - '.github/workflows/daily.yml'
      - '.github/workflows/book-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet -r requirements-book.txt
      - run: python -m unittest discover -s tests -p 'test_post_book.py' -v
