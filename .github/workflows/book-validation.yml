name: validate-book-metadata

on:
  workflow_dispatch:
    inputs:
      check_slack_auth:
        description: 'Check both Slack credentials without sending messages'
        type: boolean
        default: false
  push:
    paths:
      - 'slack_health.py'
      - 'tests/test_slack_health.py'
      - 'post_book.py'
      - 'requirements-book.txt'
      - 'tests/test_post_book.py'
      - 'data/**/*.md'
      - '.github/workflows/daily.yml'
      - '.github/workflows/book-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet -r requirements-book.txt
      - run: python -m unittest discover -s tests -p 'test_post_book.py' -v
      - run: python -m unittest discover -s tests -p 'test_slack_health.py' -v
      - name: Check Slack authentication without posting
        if: inputs.check_slack_auth
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_BOT_TOKEN_2: ${{ secrets.SLACK_BOT_TOKEN_2 }}
        run: |
          python - <<'PYTHON'
          import os
          from slack_health import check_slack_auth
          for label, name in [('primary', 'SLACK_BOT_TOKEN'), ('secondary', 'SLACK_BOT_TOKEN_2')]:
              check_slack_auth(os.environ[name], label)
          PYTHON
