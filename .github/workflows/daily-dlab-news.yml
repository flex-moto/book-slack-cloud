name: daily-dlab-news-post

on:
  # 定時トリガは外部cron（cron-job.org）→ workflow_dispatch を主とする。
  # cron-job.org 側で 毎朝23:00 UTC（=8:00 JST）に dispatch API を叩く想定。
  # GitHub純正 schedule は当リポジトリで発火しない実績があるため使わない（daily.yml と同じ理由）。
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate and preview without sending to Slack'
        type: boolean
        default: false
      collect_only:
        description: 'Refresh and persist stock without sending to Slack'
        type: boolean
        default: false

permissions:
  contents: write          # URL単位の投稿履歴を保存するため

concurrency:
  group: daily-dlab-news-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate news stock and posting logic
        run: |
          python -m unittest discover -s tests -p 'test_dlab_news*.py' -v
          python dlab_news_stock.py

      - name: Collect fresh articles in the cloud
        id: collect
        continue-on-error: true
        env:
          DLAB_MCP_TOKEN: ${{ secrets.DLAB_MCP_TOKEN }}
          DLAB_MCP_TOKEN_EXPIRES_AT: ${{ vars.DLAB_MCP_TOKEN_EXPIRES_AT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DLAB_SUMMARY_MODEL: ${{ vars.DLAB_SUMMARY_MODEL || 'claude-haiku-4-5' }}
        run: python dlab_news_collect.py

      - name: Persist collected stock
        if: ${{ steps.collect.outcome == 'success' && !inputs.dry_run }}
        run: |
          if [[ -n "$(git status --porcelain data/dlab_news/news_stock.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/dlab_news/news_stock.json
            git commit -m "chore: refresh dlab AI news stock [skip ci]"
            bash .github/scripts/push-with-retry.sh
          fi

      - name: Preview without sending
        if: inputs.dry_run
        run: python dlab_news_post.py --dry-run

      - name: Post today's dlab AI news
        if: ${{ !inputs.dry_run && !inputs.collect_only }}
        env:
          SLACK_BOT_TOKEN_2: ${{ secrets.SLACK_BOT_TOKEN_2 }}
          SLACK_CHANNEL_DLAB_NEWS: ${{ secrets.SLACK_CHANNEL_DLAB_NEWS }}
        run: python dlab_news_post.py

      - name: Persist posted history
        if: ${{ always() && !inputs.dry_run && !inputs.collect_only }}
        run: |
          if [[ -n "$(git status --porcelain data/dlab_news/post_state.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/dlab_news/post_state.json
            git commit -m "chore: update AI news posting state [skip ci]"
            bash .github/scripts/push-with-retry.sh
          fi

      - name: Report collection and posting health
        if: always()
        run: python dlab_news_health.py

      - name: Fail visibly when cloud collection failed
        if: ${{ always() && steps.collect.outcome == 'failure' }}
        run: |
          echo '::error::Cloud collection failed. Fresh existing stock may still have been posted; inspect the posting and history steps before retrying.'
          exit 1
