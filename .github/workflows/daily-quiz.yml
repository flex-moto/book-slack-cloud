name: daily-quiz-post

on:
  # 定時トリガは外部cron（cron-job.org）→ workflow_dispatch を主とする。
  # cron-job.org 側で 平日 23:35 UTC（=8:35 JST 翌日ではなく同日朝）に dispatch API を叩く。
  # GitHub純正 schedule は当リポジトリで発火しない実績があるため使わない（daily.yml と同じ理由）。
  workflow_dispatch: {}    # 手動実行 / 外部cronトリガ用

permissions:
  contents: write          # quiz_posted.log をコミットして履歴を残すため

concurrency:
  group: daily-quiz-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --quiet openpyxl

      - name: Post today's quiz
        env:
          SLACK_BOT_TOKEN_2: ${{ secrets.SLACK_BOT_TOKEN_2 }}
          SLACK_CHANNEL_QUIZ: ${{ secrets.SLACK_CHANNEL_QUIZ }}
        run: python quiz_post.py

      - name: Persist posted history
        run: |
          if [[ -n "$(git status --porcelain quiz_posted.log)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add quiz_posted.log
            git commit -m "chore: update quiz_posted.log [skip ci]"
            git push
          fi
