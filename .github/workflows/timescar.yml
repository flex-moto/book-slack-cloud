name: timescar-slot-monitor

on:
  # 1時間おき（毎時0分）に空き状況をチェック。ただし深夜 JST 01:00〜06:00 は監視しない
  # （= 監視は JST 07:00〜翌00:00）。cron は UTC 基準（JST = UTC+9）。
  #   JST 01〜06 時 = UTC 16〜21 時 → その時間帯を除外し、UTC 0-15 と 22-23 で実行。
  # GitHub純正 schedule は当リポジトリで発火しない実績があるため、定時トリガは
  # 外部cron（cron-job.org）→ workflow_dispatch を主とする。下の schedule は保険。
  schedule:
    - cron: "0 0-15,22,23 * * *"   # 毎時0分 / UTC 0-15,22-23 = JST 07:00〜翌00:00
  workflow_dispatch: {}    # 手動実行 / 外部cronトリガ用

permissions:
  contents: write          # timescar_state.json をコミットして状態を残すため

concurrency:
  group: timescar-slot-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Run monitor
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_TIMESCAR: ${{ secrets.SLACK_CHANNEL_TIMESCAR }}  # 任意。未設定なら #reservation
          TIMESCAR_COOKIE: ${{ secrets.TIMESCAR_COOKIE }}                # 手動ログイン後のセッションCookie(share.timescar.jp)
          TIMESCAR_COOKIE_TIMESCLUB: ${{ secrets.TIMESCAR_COOKIE_TIMESCLUB }}  # 会員認証(api.timesclub.jp)の持続トークン含むCookie
          # 監視対象の上書き（任意）。未設定ならスクリプト内デフォルト
          #   station=LM25(利尻富士観光ホテル駐車場) / dates=2026-08-10,08-11 / times=08〜19
          TIMESCAR_STATION: ${{ vars.TIMESCAR_STATION }}              # ステーションコード(scd)
          TIMESCAR_STATION_QUERY: ${{ vars.TIMESCAR_STATION_QUERY }}  # ステーション検索キーワード
          TIMESCAR_CARS: ${{ vars.TIMESCAR_CARS }}                    # 車両名の一部（カンマ区切り）
          TIMESCAR_TARGET_DATES: ${{ vars.TIMESCAR_TARGET_DATES }}    # 監視対象日 "YYYY-MM-DD" カンマ区切り
          TIMESCAR_TIMES: ${{ vars.TIMESCAR_TIMES }}                  # 監視する時台 "HH"（カンマ区切り）
          TIMESCAR_MAX_PAGES: ${{ vars.TIMESCAR_MAX_PAGES }}          # タイムテーブル送り上限
          TIMESCAR_MAX_COOKIE_NOTICES: ${{ vars.TIMESCAR_MAX_COOKIE_NOTICES }}  # 認証エラー通知上限
        run: python timescar_monitor.py

      - name: Persist state
        if: ${{ always() }}
        run: |
          if [[ -n "$(git status --porcelain timescar_state.json)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add timescar_state.json
            git commit -m "chore: update timescar slot state [skip ci]"
            git push
          fi
